# Local stack: Kafka (KRaft) + Airflow + streaming scaler.
#   docker compose -f platform/docker-compose.yml up -d --build      # broker, topics, airflow, scaler
#   docker compose -f platform/docker-compose.yml run --rm producer  # replay test days 10-13
#   docker compose -f platform/docker-compose.yml run --rm verify    # check decisions
# Airflow UI: http://localhost:8080 (user "admin", password printed in `docker compose logs airflow`)
name: predictive-autoscaling

x-app: &app
  build:
    context: ..
    dockerfile: platform/Dockerfile
  image: predictive-autoscaling-platform:latest
  volumes:
    - ..:/opt/app
  environment:
    KAFKA_BOOTSTRAP: kafka:29092
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in invocations scaling-decisions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done

  airflow:
    <<: *app
    command: ["airflow", "standalone"]
    ports: ["8080:8080"]

  train-day10:          # publishes the first model version so the scaler can start
    <<: *app
    command: ["sh", "-c", "airflow db migrate >/dev/null && airflow dags reserialize >/dev/null && airflow dags test autoscaling_pipeline 2019-07-25 >/tmp/dag.log 2>&1 && cat platform/data/registry/LATEST"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      AIRFLOW_HOME: /tmp/airflow-train

  scaler:
    <<: *app
    command: ["python", "platform/streaming/scaler.py", "--idle-timeout", "86400",
              "--checkpoint", "platform/data/scaler_checkpoint_docker.json"]
    restart: on-failure
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      train-day10: {condition: service_completed_successfully}

  producer:
    <<: *app
    profiles: ["tools"]
    command: ["python", "platform/streaming/producer.py", "--from-day", "10", "--speed", "0"]

  verify:
    <<: *app
    profiles: ["tools"]
    command: ["python", "platform/streaming/verify.py"]
